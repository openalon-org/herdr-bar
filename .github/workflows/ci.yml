name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test Swift model and protocol
        run: swift test
      - name: Test JavaScript oracle
        run: node --test tests/herdr.test.mjs tests/changelog.test.mjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/from-markdown.test.mjs
      - run: npm run docs:build
      - run: node --test tests/seo.test.mjs
