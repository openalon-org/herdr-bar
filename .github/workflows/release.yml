name: Release macOS app

# Slim cousin of cmux's tag → artifact → GitHub Release lane.
# No Developer ID / notarization / Sparkle: the zip is unsigned ad-hoc.
# Gatekeeper will quarantine a browser download; right-click Open once,
# or `xattr -cr HerdrBar.app`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Package HerdrBar.app
        env:
          HERDR_BAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          HERDR_BAR_UNIVERSAL: "1"
        run: |
          set -euo pipefail
          ver="${HERDR_BAR_VERSION#v}"
          export HERDR_BAR_VERSION="$ver"
          mkdir -p dist
          ./scripts/package-app.sh dist/HerdrBar.app
          ditto -c -k --keepParent dist/HerdrBar.app "dist/HerdrBar-${ver}-macos.zip"

      - name: Changelog notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HERDR_BAR_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${HERDR_BAR_VERSION#v}"
          {
            ./scripts/changelog-notes.sh "$ver"
            printf '\n\nThe zip is ad-hoc signed. After unzip:\n\n```\nxattr -cr HerdrBar.app\nopen HerdrBar.app\n```\n'
            printf '\nFull notes: https://openalon.com/herdr-bar/changelog/\n'
          } > dist/RELEASE_NOTES.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HerdrBar-macos
          path: dist/HerdrBar-*-macos.zip
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HerdrBar-*-macos.zip
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
